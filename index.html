<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book an artist · Mall Music Inc.</title>
<meta name="description" content="Request a booking with Mall Music Inc.">
<!-- Warm the Apps Script hosts while the page paints. -->
<link rel="preconnect" href="https://script.google.com">
<link rel="preconnect" href="https://script.googleusercontent.com">
<style>
  html, body { margin: 0; height: 100%; background: #0b0b0c; }
  iframe { display: block; border: 0; width: 100%; height: 100dvh; }
  noscript a { color: #e6c85c; font: 15px -apple-system, BlinkMacSystemFont, sans-serif; }
</style>
</head>
<body>
<!--
  The booking form is the Agent C Apps Script web app (public deployment). Apps Script cannot
  serve a custom domain, so this page frames it; doGet sets XFrameOptionsMode.ALLOWALL.
  The path (or ?artist=) names the artist; see the script below.
  The k token is the same one every booking link already carries; the form keeps its password.
-->
<iframe id="app" title="Booking request form" allow="clipboard-read; clipboard-write"
  src="https://script.google.com/macros/s/AKfycbyTUlWj4h4FTWj-pETwEYWWN9O5DXg2nvfZ3KRC4IcPMDoDTUWfZv5apPYl_8aFHqU3EA/exec?book=1&k=QGcFN6DZwxMS"></iframe>
<script>
  // bookings.mallmusicinc.com/<artist> pre-selects that artist: the path is a name slug
  // (djchad95), resolved by the form itself, so a new artist needs nothing deployed here.
  // ?artist=<id or slug> still works. Old Short.io paths that match no artist show the full list.
  var seg = decodeURIComponent(location.pathname.split('/').filter(Boolean)[0] || '');
  var a = new URLSearchParams(location.search).get('artist') || seg;
  if (a && /^[\w-]{1,40}$/.test(a) && !/^(index|404)(\.html)?$/i.test(a)) document.getElementById('app').src += '&artist=' + encodeURIComponent(a);
</script>
<noscript><a href="https://script.google.com/macros/s/AKfycbyTUlWj4h4FTWj-pETwEYWWN9O5DXg2nvfZ3KRC4IcPMDoDTUWfZv5apPYl_8aFHqU3EA/exec?book=1&k=QGcFN6DZwxMS">Open the booking form</a></noscript>
</body>
</html>
